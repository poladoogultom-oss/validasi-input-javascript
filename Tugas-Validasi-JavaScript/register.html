```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

    <div class="bg-white w-full max-w-lg rounded-2xl shadow-lg p-8">

        <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">
            Register
        </h1>

        <p class="text-center text-gray-500 mb-6">
            Silakan isi data diri Anda
        </p>

        <form id="registerForm" action="dashboard.html" method="GET" class="space-y-5">

            <!-- Username -->
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Masukkan username"
                >

                <p id="usernameError" class="text-red-500 text-sm mt-1"></p>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Masukkan password"
                >

                <p id="passwordError" class="text-red-500 text-sm mt-1"></p>
            </div>

            <!-- Nama -->
            <div>
                <label for="nama" class="block text-sm font-medium text-gray-700 mb-1">
                    Nama Lengkap
                </label>

                <input
                    type="text"
                    id="nama"
                    name="nama"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Masukkan nama lengkap"
                >

                <p id="namaError" class="text-red-500 text-sm mt-1"></p>
            </div>

            <!-- Tanggal Lahir -->
            <div>
                <label for="tanggalLahir" class="block text-sm font-medium text-gray-700 mb-1">
                    Tanggal Lahir
                </label>

                <input
                    type="date"
                    id="tanggalLahir"
                    name="tanggalLahir"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                >

                <p id="tanggalLahirError" class="text-red-500 text-sm mt-1"></p>
            </div>

            <!-- Alamat -->
            <div>
                <label for="alamat" class="block text-sm font-medium text-gray-700 mb-1">
                    Alamat
                </label>

                <textarea
                    id="alamat"
                    name="alamat"
                    rows="3"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Masukkan alamat lengkap"
                ></textarea>

                <p id="alamatError" class="text-red-500 text-sm mt-1"></p>
            </div>

            <!-- Nomor Telepon -->
            <div>
                <label for="telepon" class="block text-sm font-medium text-gray-700 mb-1">
                    Nomor Telepon
                </label>

                <input
                    type="text"
                    id="telepon"
                    name="telepon"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Contoh: 628123456789"
                >

                <p id="teleponError" class="text-red-500 text-sm mt-1"></p>
            </div>

            <!-- Tombol -->
            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200"
            >
                Register
            </button>

        </form>
    </div>

    <!-- JavaScript -->
    <script src="validasi_input.js" defer></script>

</body>
</html>
```
