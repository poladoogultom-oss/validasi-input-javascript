<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

    <div class="bg-white w-full max-w-lg rounded-2xl shadow-lg p-8">

        <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">
            Register
        </h1>

        <p class="text-center text-gray-500 mb-6">
            Silakan isi data diri Anda
        </p>

        <form id="registerForm" action="dashboard.html" method="GET">

            <div class="mb-4">
                <label class="block mb-1 font-medium">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="w-full px-4 py-2 border rounded-lg"
                    placeholder="Masukkan username"
                >
                <p id="usernameError" class="text-red-500 text-sm"></p>
            </div>

            <div class="mb-4">
                <label class="block mb-1 font-medium">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="w-full px-4 py-2 border rounded-lg"
                    placeholder="Masukkan password"
                >
                <p id="passwordError" class="text-red-500 text-sm"></p>
            </div>

            <div class="mb-4">
                <label class="block mb-1 font-medium">Nama</label>
                <input
                    type="text"
                    id="nama"
                    name="nama"
                    class="w-full px-4 py-2 border rounded-lg"
                    placeholder="Masukkan nama lengkap"
                >
                <p id="namaError" class="text-red-500 text-sm"></p>
            </div>

            <div class="mb-4">
                <label class="block mb-1 font-medium">Tanggal Lahir</label>
                <input
                    type="date"
                    id="tanggalLahir"
                    name="tanggalLahir"
                    class="w-full px-4 py-2 border rounded-lg"
                >
                <p id="tanggalLahirError" class="text-red-500 text-sm"></p>
            </div>

            <div class="mb-4">
                <label class="block mb-1 font-medium">Alamat</label>
                <textarea
                    id="alamat"
                    name="alamat"
                    rows="3"
                    class="w-full px-4 py-2 border rounded-lg"
                    placeholder="Masukkan alamat"
                ></textarea>
                <p id="alamatError" class="text-red-500 text-sm"></p>
            </div>

            <div class="mb-6">
                <label class="block mb-1 font-medium">Nomor Telepon</label>
                <input
                    type="text"
                    id="telepon"
                    name="telepon"
                    class="w-full px-4 py-2 border rounded-lg"
                    placeholder="Contoh: 628123456789"
                >
                <p id="teleponError" class="text-red-500 text-sm"></p>
            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700"
            >
                Register
            </button>

        </form>
    </div>

    <script src="validasi_input.js" defer></script>

</body>
</html>
